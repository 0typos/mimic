name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: lab/mimic-lab
      - run: corepack enable
      - name: Choose version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - run: make lab-check
      - run: ./lab/mimic-lab up
      - run: ./lab/mimic-lab check
      - name: Stop tutorial lab
        if: always()
        run: ./lab/mimic-lab down
      - run: make release VERSION="${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v7
        with:
          name: mimic-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error
      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
