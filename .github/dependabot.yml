version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /integrations/caido
    schedule:
      interval: monthly
    groups:
      caido-dependencies:
        patterns: ["*"]
    ignore:
      # vue-tsc (3.3.x) still loads typescript/lib/tsc, which TypeScript 7 no longer ships.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
